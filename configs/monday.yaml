# NULLXES 90-day Monte Carlo — MONDAY overlay (tail / clustered-crisis prior)
# Merged on top of baseline.yaml. ASSUMPTION / PLACEHOLDER — not a forecast.

extends: baseline.yaml

meta:
  name: monday

simulation:
  seed: 20260928
  shock_severity_multiplier: 1.80

bank:
  approval_probability: 0.03          # ASSUMPTION / PLACEHOLDER
  reduced_limit_probability: 0.75
  fin_stress_approval_decay: 0.35
  decision_delay_distribution:
    type: uniform_int
    min_days: 14
    max_days: 60

deal:
  close_probability: 0.02
  failure_probability: 0.55
  sanctions_block_probability: 0.28
  legal_block_probability: 0.20
  counterparty_failure_probability: 0.18
  geo_fail_probability: 0.22
  delay_distribution:
    type: uniform_int
    min_days: 30
    max_days: 90

hazards:
  SEC:
    p90: 0.55
    beta: 0.80
    theta: 14.0
    exposure_rub: 120000.0
    severity_median: 0.80
    severity_sigma: 1.10
  FIN:
    p90: 0.60
    beta: 0.85
    theta: 21.0
    exposure_rub: 90000.0
    severity_median: 0.75
    severity_sigma: 1.15
  MACRO:
    p90: 0.58
    beta: 0.75
    theta: 18.0
    exposure_rub: 100000.0
    severity_median: 0.70
    severity_sigma: 1.05
  GEO:
    p90: 0.52
    beta: 0.95
    theta: 35.0
    exposure_rub: 160000.0
    severity_median: 0.90
    severity_sigma: 1.20
  BIZ:
    p90: 0.50
    beta: 0.60
    theta: 14.0
    exposure_rub: 110000.0
    severity_median: 0.75
    severity_sigma: 1.10
  BLACK_SWAN:
    p_daily: 0.012                    # ASSUMPTION / PLACEHOLDER
    beta: 1.00
    theta: 45.0
    pareto_xmin: 250000.0
    pareto_alpha: 1.25
    exposure_rub: 1.0
    severity_median: 1.0
    severity_sigma: 0.0

contagion:
  rho: 0.96
  sigma: 0.80
  A:
    SEC:        [0.20, 0.45, 0.65, 0.15, 0.50, 0.12]
    FIN:        [0.15, 0.40, 0.35, 0.10, 0.42, 0.10]
    MACRO:      [0.30, 0.50, 0.35, 0.20, 0.35, 0.12]
    GEO:        [0.22, 0.60, 0.45, 0.35, 0.70, 0.15]
    BIZ:        [0.12, 0.35, 0.22, 0.10, 0.35, 0.08]
    BLACK_SWAN: [0.95, 0.95, 0.95, 0.80, 0.95, 0.50]

policies:
  FREEZE_90:
    enabled: true
    freeze_discretionary_fraction: 0.90
    trigger:
      cash_below: 100000.0
      runway_days_below: 20.0
      min_day: 0
  EXIT_RU:
    enabled: true
    freeze_discretionary_fraction: 0.90
    one_off_cost: 800000.0
    post_exit_burn_factor: 0.40
    trigger:
      on_sanctions_block: true
      on_legal_block: true
      on_deal_fail_and_bank_decline: true
      cash_below: 500.0
      min_geo_events: 2
      min_day: 0
